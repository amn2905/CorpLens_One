<svg width="64" height="64" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#a1a1aa" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#e4e4e7" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Background Shield Container -->
  <rect width="100" height="100" rx="20" fill="#030303" />

  <!-- Outer Cyber Shield Base -->
  <path
    d="M50 12 L82 27 V51 C82 69 68 84 50 90 C32 84 18 69 18 51 V27 L50 12 Z"
    fill="url(#shieldGrad)"
    fill-opacity="0.2"
    stroke="url(#shieldGrad)"
    stroke-width="3"
    stroke-linejoin="round"
  />

  <!-- Inner Lens Aperture Ring -->
  <circle cx="50" cy="49" r="20" stroke="#ffffff" stroke-width="2" stroke-dasharray="5 3" opacity="0.9" />
  <circle cx="50" cy="49" r="14" stroke="#a1a1aa" stroke-width="1.5" opacity="0.7" />

  <!-- Optical Aperture Blades -->
  <line x1="50" y1="29" x2="61" y2="42" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
  <line x1="70" y1="49" x2="57" y2="60" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
  <line x1="50" y1="69" x2="39" y2="56" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
  <line x1="30" y1="49" x2="43" y2="38" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />

  <!-- Central Quantum Eye Core -->
  <circle cx="50" cy="49" r="6" fill="url(#coreGlow)" />
  <circle cx="50" cy="49" r="2" fill="#000000" />
</svg>
