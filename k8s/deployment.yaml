apiVersion: apps/v1
kind: Deployment
metadata:
  name: corplens-backend
  labels:
    app: corplens-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: corplens-backend
  template:
    metadata:
      labels:
        app: corplens-backend
    spec:
      containers:
      - name: backend
        image: corplens/backend:v1.0.0
        ports:
        - containerPort: 8000
        env:
        - name: POSTGRES_SERVER
          value: "corplens-postgres-service"
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: corplens-secrets
              key: postgres-password
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: corplens-backend-service
spec:
  selector:
    app: corplens-backend
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
  type: ClusterIP
